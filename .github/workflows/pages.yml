# Publishes the dashboard in app/ to GitHub Pages. The page is static — it reads Arc testnet and
# Ethereum mainnet from the visitor's browser — so there are no secrets and no backend here.
name: Dashboard

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "keeper/src/**"
      - ".github/workflows/pages.yml"
  # Hourly rebuild with a fresh event snapshot. The page catches up from the snapshot's cursor to
  # the chain head in the visitor's browser; Arc makes ~7k blocks an hour, so an hourly snapshot
  # keeps that to a single getLogs page instead of a burst the public node rate-limits.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # Refresh the seed snapshot with the keeper's own indexer, starting from the committed one.
      # Not committed back; if the RPC is unavailable the committed snapshot ships instead.
      - name: Refresh event snapshot
        continue-on-error: true
        run: |
          (cd keeper && npm ci)
          mkdir -p keeper/data && cp app/public/events-5042002.json keeper/data/
          (cd app && npm run -s snapshot)
      - run: npm run typecheck && npm run build
        working-directory: app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
